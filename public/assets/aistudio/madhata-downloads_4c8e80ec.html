<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Downloads</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
:root{--bg:#0b0e16;--rail-bg:#121a2b;--acc:#5b4ee8;--ease:cubic-bezier(.22,1,.36,1);--rail:4.4rem;--g:clamp(1.25rem,5.4vw,8rem);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
font-size:clamp(14px,.4vw + 10.2px,30px);scroll-behavior:smooth;background:var(--bg)}
body{background:var(--bg);color:#fff;font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid #9d94ff;outline-offset:3px}
.i{width:1.25rem;height:1.25rem;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
@keyframes up{from{opacity:0;transform:translateY(1.3rem)}}
.rv{animation:up 1s var(--ease) both;animation-delay:calc(var(--n,0)*90ms + 100ms)}

/* rail */
.rail{position:fixed;z-index:60;inset:0 auto 0 0;width:var(--rail);padding:1.1rem 0 1.2rem;background:var(--rail-bg);border-right:1px solid rgba(255,255,255,.06);display:flex;flex-direction:column;align-items:center;gap:.5rem}
.logo{width:2rem;height:2rem;border-radius:.65rem;margin-bottom:1.2rem;background:linear-gradient(135deg,#7f63ff,#3b2fd0);display:grid;place-items:center;font-weight:800;font-size:1.1rem;flex:none}
.nb{width:2.7rem;height:2.7rem;border-radius:.85rem;display:grid;place-items:center;color:#8d95aa;transition:color .3s,background .3s,transform .4s var(--ease)}
.nb:hover{color:#fff;background:rgba(255,255,255,.07);transform:translateX(2px) scale(1.06)}.nb:active{transform:scale(.92)}
.sp{margin-top:auto}
.av{width:2.2rem;height:2.2rem;border-radius:50%;margin-top:.6rem;border:2px solid #243049;background:radial-gradient(circle at 35% 30%,#ffd29b,#ee7a5a 60%,#8a3a5a)}

/* minimal top: back + centred title */
.top{position:relative;display:grid;grid-template-columns:2.6rem 1fr 2.6rem;align-items:center;gap:1rem;padding:1.1rem 1.25rem 1.1rem calc(var(--rail) + 1.25rem)}
.top::after{content:"";position:absolute;left:calc(var(--rail) + 1.25rem);right:1.25rem;bottom:0;height:1px;background:rgba(255,255,255,.1)}
.top h1{text-align:center;font-size:1.1rem;font-weight:700;letter-spacing:-.005em}
.bk{width:2.6rem;height:2.6rem;border-radius:50%;display:grid;place-items:center;background:rgba(20,27,45,.92);border:1px solid rgba(255,255,255,.12);transition:transform .4s var(--ease),background .3s}
.bk:hover{background:#1d2742;transform:translateX(-3px) scale(1.08)}.bk:active{transform:scale(.92)}

/* storage */
.stg{padding:clamp(1.5rem,4svh,2.6rem) var(--g) 0 calc(var(--rail) + var(--g));max-width:calc(60rem + var(--rail) + var(--g))}
.stg .l{display:flex;justify-content:space-between;gap:1rem;margin-bottom:.7rem;font-size:.82rem;font-weight:600;color:#9aa1b4}.stg .l b{color:#fff}
.sb{display:flex;height:.5rem;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden}
.sb i{display:block;height:100%;transition:width .8s var(--ease)}.sb .o{background:rgba(255,255,255,.28)}.sb .d{background:var(--acc)}

/* sections */
.ct{padding:0 0 clamp(2.5rem,7svh,5rem) calc(var(--rail) + var(--g))}
.sh{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding-right:var(--g);margin:clamp(1.6rem,4svh,2.4rem) 0 1rem;font-size:1.1rem;font-weight:700}
.sh small{margin-left:.5rem;font-size:.8rem;font-weight:600;color:#9aa1b4}
.lnk{font-size:.8rem;font-weight:600;color:#9aa1b4;transition:color .3s}.lnk:hover{color:#fff}
.lst{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,27rem),1fr));gap:1rem clamp(1rem,1.6vw,2.2rem);padding-right:var(--g);align-items:start}

/* cards */
.dc{border-radius:1.1rem;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);transition:opacity .35s,transform .5s var(--ease),border-color .3s,background .3s}
.dc.n{animation:up .7s var(--ease) both;animation-delay:calc(var(--i)*55ms)}
.dc.out{opacity:0;transform:scale(.93);pointer-events:none}
.dc:hover{border-color:rgba(255,255,255,.2);background:rgba(255,255,255,.06)}
.dr{display:grid;grid-template-columns:minmax(0,36%) 1fr auto;gap:1rem;align-items:center;padding:.7rem .8rem .7rem .7rem}
.th{position:relative;display:block;aspect-ratio:16/9;border-radius:.75rem;overflow:hidden;background:linear-gradient(135deg,hsl(var(--h) 45% 32%),hsl(calc(var(--h) + 30) 40% 14%)) center/cover}
.th::before{content:"";position:absolute;inset:0;background:linear-gradient(transparent 55%,rgba(0,0,0,.5))}
.q{position:absolute;z-index:1;left:.4rem;top:.4rem;padding:.12rem .45rem;border-radius:.35rem;background:rgba(0,0,0,.6);font-size:.58rem;font-weight:800;letter-spacing:.04em}
.tx{display:block;min-width:0}
.tx b{display:block;font-size:.95rem;font-weight:700;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx small{display:block;margin-top:.3rem;font-size:.76rem;font-weight:600;color:#aab0c0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx em{display:block;margin-top:.3rem;font-style:normal;font-size:.72rem;font-weight:600;color:#9d94ff}
.tx em.warn{color:#ffb020}
.bar{height:.28rem;margin-top:.55rem;border-radius:9px;background:rgba(255,255,255,.16);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);transform-origin:left;transform:scaleX(var(--p,0));transition:transform .5s linear}
.dc.pz .bar i{background:#8a90a3}
.ac{display:flex;gap:.3rem;align-items:center}
.ib{display:grid;place-items:center;width:2.4rem;height:2.4rem;border-radius:50%;color:#b4bacb;transition:background .3s,color .3s,transform .4s var(--ease)}
.ib:hover{background:rgba(255,255,255,.12);color:#fff;transform:scale(1.08)}.ib:active{transform:scale(.9)}
.ib.pr{background:var(--acc);color:#fff;box-shadow:0 .5rem 1.4rem -.4rem rgba(91,78,232,.7)}.ib.pr:hover{background:#6d61f2}
.ib.rd:hover{color:#ff9aa6;background:rgba(255,122,138,.12)}
.ib .i{width:1.1rem;height:1.1rem}.ib.pr .i{fill:rgba(255,255,255,.18)}
.ib.ch .i{transition:transform .5s var(--ease)}.ib.ch[aria-expanded="true"] .i{transform:rotate(180deg)}
.er-w{display:grid;grid-template-rows:0fr;transition:grid-template-rows .55s var(--ease)}.er-w.open{grid-template-rows:1fr}
.er-i{min-height:0;overflow:hidden}
.er{display:flex;align-items:center;gap:.8rem;padding:.55rem .8rem .55rem 1rem;border-top:1px solid rgba(255,255,255,.07)}
.er .tx{flex:1}.er .tx b{font-size:.85rem}
.er.out{opacity:0;transition:opacity .3s}
.empty{display:grid;justify-items:center;gap:.7rem;max-width:26rem;margin:3rem 0;padding-right:var(--g);text-align:center;color:#9aa1b4;font-size:.9rem}
.empty .big{width:4.4rem;height:4.4rem;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(255,255,255,.2)}.empty .big .i{width:1.8rem;height:1.8rem}
.empty h3{font-size:1.15rem;color:#fff}

.toast{position:fixed;z-index:80;left:50%;bottom:max(1.6rem,env(safe-area-inset-bottom));display:flex;align-items:center;gap:1.2rem;padding:.75rem .8rem .75rem 1.3rem;border-radius:99px;background:#1b2338;border:1px solid rgba(255,255,255,.14);font-size:.85rem;font-weight:600;box-shadow:0 1.4rem 3rem -1rem rgba(0,0,0,.9);opacity:0;pointer-events:none;transform:translate(-50%,1.6rem);transition:opacity .35s,transform .5s var(--ease)}
.toast.on{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
.toast button{padding:.4rem .9rem;border-radius:99px;background:rgba(255,255,255,.1);font-weight:700;color:#b5adff;transition:background .3s}.toast button:hover{background:rgba(255,255,255,.18)}

@media (max-width:720px){
:root{--rail:0rem;--g:1.1rem}
.rail{inset:auto 0 0 0;width:auto;flex-direction:row;justify-content:space-around;gap:0;padding:.55rem .8rem calc(.55rem + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid rgba(255,255,255,.08)}
.rail .logo,.rail .gear,.rail .av{display:none}.sp{margin:0}
.top{padding-inline:1.1rem}.top::after{left:1.1rem;right:1.1rem}
.ct{padding-bottom:6rem}
.dr{grid-template-columns:minmax(0,34%) 1fr auto;gap:.8rem;padding:.6rem}
.toast{bottom:5.2rem;width:max-content;max-width:92vw}
}
@media (prefers-reduced-motion:reduce){*,::before,::after{animation:none!important;transition-duration:.01ms!important}:root{scroll-behavior:auto}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>
<symbol id="search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></symbol>
<symbol id="chart" viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></symbol>
<symbol id="user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></symbol>
<symbol id="cal" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="16" rx="2.5"/><path d="M4 10h16M8 3v4M16 3v4"/></symbol>
<symbol id="bolt" viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></symbol>
<symbol id="bell" viewBox="0 0 24 24"><path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4zM10 21h4"/></symbol>
<symbol id="gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></symbol>
<symbol id="al" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></symbol>
<symbol id="x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
<symbol id="play" viewBox="0 0 24 24"><path d="M8.5 5.5v13L19 12z"/></symbol>
<symbol id="pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></symbol>
<symbol id="trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-12M9 7V4h6v3"/></symbol>
<symbol id="chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
<symbol id="dl" viewBox="0 0 24 24"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M5 20h14"/></symbol>
</defs></svg>

<nav class="rail" aria-label="Main">
  <div class="logo">M</div>
  <button class="nb" aria-label="Home"><svg class="i"><use href="#home"/></svg></button>
  <button class="nb" aria-label="Search"><svg class="i"><use href="#search"/></svg></button>
  <button class="nb" aria-label="Stats"><svg class="i"><use href="#chart"/></svg></button>
  <button class="nb" aria-label="Profile"><svg class="i"><use href="#user"/></svg></button>
  <button class="nb" aria-label="Calendar"><svg class="i"><use href="#cal"/></svg></button>
  <button class="nb" aria-label="Activity"><svg class="i"><use href="#bolt"/></svg></button>
  <button class="nb" aria-label="Notifications"><svg class="i"><use href="#bell"/></svg></button>
  <button class="nb gear sp" aria-label="Settings"><svg class="i"><use href="#gear"/></svg></button>
  <div class="av" role="img" aria-label="Account"></div>
</nav>

<header class="top rv" style="--n:0">
  <button class="bk" aria-label="Back"><svg class="i"><use href="#al"/></svg></button>
  <h1>Downloads</h1>
  <span aria-hidden="true"></span>
</header>

<main>
  <section class="stg rv" style="--n:1" id="stg" aria-label="Storage">
    <div class="l"><span><b id="su">0 GB</b> used by downloads</span><span id="sf"></span></div>
    <div class="sb"><i class="o" id="so"></i><i class="d" id="sd"></i></div>
  </section>
  <div class="ct rv" style="--n:2" id="ct"></div>
</main>

<div class="toast" id="toast" role="status"><span id="tm"></span><button id="undo">Undo</button></div>

<script>
const SRC='https://raw.githubusercontent.com/mediaelement/mediaelement-files/master/big_buck_bunny.mp4'; /* frames for thumbnails */
const $=s=>document.querySelector(s);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const THUMB_AT=[4,12,19,26,33,40,47,54],TH={};
const TOTAL=64*1024,OTHER=38.4*1024;   /* device storage in MB (placeholder) */

/* placeholder data. spd = MB/s, mb = size in MB */
let ACTIVE=[
{id:1,t:'Houses & Dragons',l:'S1:E5',sub:'Fire Over Harrow',mb:1100,p:.42,st:'dl',spd:22,q:'HD',k:0},
{id:2,t:'The Mandalorian',l:'S2:E6',sub:'Chapter 14',mb:900,p:.12,st:'dl',spd:16,q:'HD',k:2},
{id:3,t:'Night Ward',l:'',sub:'Movie',mb:1400,p:.67,st:'pz',spd:18,q:'4K',k:6}];
let DONE=[
{id:10,type:'series',t:'Houses & Dragons',q:'HD',k:0,eps:[
  {l:'S1:E1',sub:'The Iron Throne Rises',mb:520,exp:12},{l:'S1:E2',sub:'Blood and Embers',mb:510,exp:12},
  {l:'S1:E3',sub:'The Winter Pact',mb:540,exp:9},{l:'S1:E4',sub:'A Crown of Ash',mb:530,exp:9}]},
{id:11,type:'series',t:'The Last of Us',q:'4K',k:1,eps:[
  {l:'S1:E1',sub:'When You’re Lost',mb:910,exp:6},{l:'S1:E2',sub:'Infected',mb:880,exp:6}]},
{id:12,type:'movie',t:'Blue Hour',sub:'Movie',mb:1800,exp:2,q:'HD',k:7},
{id:13,type:'movie',t:'Redline',sub:'Movie',mb:1250,exp:21,q:'HD',k:3},
{id:14,type:'movie',t:'Zero Hour',sub:'Movie',mb:2100,exp:14,q:'4K',k:5}];
const open=new Set([10]);let fresh=true,tt,undoFn=null,nid=100;

const size=mb=>mb>=1024?(mb/1024).toFixed(1)+' GB':Math.round(mb)+' MB';
const sizeOf=d=>d.type==='series'?d.eps.reduce((a,e)=>a+e.mb,0):d.mb;
const eta=a=>{const s=Math.max(1,Math.round((1-a.p)*a.mb/a.spd));return s>=60?`${Math.floor(s/60)}m ${s%60}s left`:`${s}s left`};
const status=a=>a.st==='pz'?`Paused · ${Math.round(a.p*100)}%`:`${Math.round(a.p*100)}% · ${a.spd} MB/s · ${eta(a)}`;
const expTxt=e=>e<=3?`Expires in ${e} day${e===1?'':'s'}`:`Expires in ${e} days`;
const thumb=(k,q)=>`<span class="th" data-k="${k}" style="--h:${(k*47+210)%360}${TH[k]?`;background-image:url(${TH[k]})`:''}"><span class="q">${q}</span></span>`;
const ico=n=>`<svg class="i"><use href="#${n}"/></svg>`;

/* render */
function activeCard(a,i){
  return `<div class="dc${fresh?' n':''}${a.st==='pz'?' pz':''}" style="--i:${i}" data-id="${a.id}"><div class="dr">${thumb(a.k,a.q)}<span class="tx"><b>${esc(a.t)}</b><small>${a.l?a.l+' · ':''}${esc(a.sub)} · ${size(a.mb)}</small><span class="bar"><i style="--p:${a.p}"></i></span><em data-s>${status(a)}</em></span><span class="ac"><button class="ib" data-act="${a.st==='pz'?'resume':'pause'}" aria-label="${a.st==='pz'?'Resume':'Pause'} download">${ico(a.st==='pz'?'play':'pause')}</button><button class="ib rd" data-act="cancel" aria-label="Cancel download">${ico('x')}</button></span></div></div>`;
}
function doneCard(d,i){
  const c=fresh?' n':'';
  if(d.type==='movie'){
    return `<div class="dc${c}" style="--i:${i}" data-id="${d.id}"><div class="dr">${thumb(d.k,d.q)}<span class="tx"><b>${esc(d.t)}</b><small>${d.sub} · ${size(d.mb)}</small><em class="${d.exp<=3?'warn':''}">${expTxt(d.exp)}</em></span><span class="ac"><button class="ib pr" data-act="play" aria-label="Play ${esc(d.t)}">${ico('play')}</button><button class="ib rd" data-act="del" aria-label="Delete ${esc(d.t)}">${ico('trash')}</button></span></div></div>`;
  }
  const o=open.has(d.id),soon=Math.min(...d.eps.map(e=>e.exp));
  return `<div class="dc${c}" style="--i:${i}" data-id="${d.id}"><div class="dr">${thumb(d.k,d.q)}<span class="tx"><b>${esc(d.t)}</b><small>${d.eps.length} episode${d.eps.length===1?'':'s'} · ${size(sizeOf(d))}</small><em class="${soon<=3?'warn':''}">${expTxt(soon)}</em></span><span class="ac"><button class="ib rd" data-act="del" aria-label="Delete ${esc(d.t)}">${ico('trash')}</button><button class="ib ch" data-act="tog" aria-expanded="${o}" aria-label="Show episodes">${ico('chev')}</button></span></div>
  <div class="er-w${o?' open':''}"><div class="er-i">${d.eps.map((e,j)=>`<div class="er" data-e="${j}"><span class="tx"><b>${e.l} · ${esc(e.sub)}</b><small>${size(e.mb)} · ${expTxt(e.exp)}</small></span><button class="ib pr" data-act="play" aria-label="Play ${esc(e.sub)}">${ico('play')}</button><button class="ib rd" data-act="del" aria-label="Delete ${esc(e.sub)}">${ico('trash')}</button></div>`).join('')}</div></div></div>`;
}
function render(){
  let h='';
  if(ACTIVE.length)h+=`<div class="sh"><span>Downloading<small>${ACTIVE.length}</small></span></div><div class="lst">${ACTIVE.map(activeCard).join('')}</div>`;
  if(DONE.length)h+=`<div class="sh"><span>Downloaded<small>${DONE.length}</small></span><button class="lnk" data-act="all">Delete all</button></div><div class="lst">${DONE.map(doneCard).join('')}</div>`;
  if(!h)h=`<div class="empty"><div class="big">${ico('dl')}</div><h3>No downloads yet</h3><p>Titles you download will show up here so you can watch them offline.</p></div>`;
  $('#ct').innerHTML=h;fresh=false;storage();
}
function storage(){
  const dl=DONE.reduce((a,d)=>a+sizeOf(d),0)+ACTIVE.reduce((a,x)=>a+x.mb*x.p,0);
  $('#su').textContent=size(dl);$('#sf').textContent=`${size(TOTAL-OTHER-dl)} free of ${size(TOTAL)}`;
  $('#so').style.width=(OTHER/TOTAL*100)+'%';$('#sd').style.width=(dl/TOTAL*100)+'%';
}

/* undo */
function toast(msg){$('#tm').textContent=msg;$('#toast').classList.add('on');clearTimeout(tt);tt=setTimeout(()=>{$('#toast').classList.remove('on');undoFn=null},4500)}
function change(msg,fn){
  const snap=JSON.stringify({ACTIVE,DONE});fn();
  undoFn=()=>{({ACTIVE,DONE}=JSON.parse(snap));fresh=true;render()};render();toast(msg);
}
$('#undo').onclick=()=>{if(undoFn){undoFn();undoFn=null;$('#toast').classList.remove('on')}};

/* actions */
$('#ct').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const card=b.closest('.dc'),id=card&&+card.dataset.id,act=b.dataset.act;
  const a=ACTIVE.find(x=>x.id===id),d=DONE.find(x=>x.id===id);
  if(act==='pause'||act==='resume'){a.st=act==='pause'?'pz':'dl';render()}
  else if(act==='cancel'){card.classList.add('out');setTimeout(()=>change('Download cancelled',()=>{ACTIVE=ACTIVE.filter(x=>x.id!==id)}),300)}
  else if(act==='tog'){open.has(id)?open.delete(id):open.add(id);b.setAttribute('aria-expanded',open.has(id));card.querySelector('.er-w').classList.toggle('open')}
  else if(act==='all'){change('All downloads deleted',()=>{DONE=[]})}
  else if(act==='del'){
    const row=b.closest('.er');
    if(row&&d.eps.length>1){row.classList.add('out');const j=+row.dataset.e;setTimeout(()=>change('Episode deleted',()=>{d.eps.splice(j,1)}),280)}
    else{card.classList.add('out');setTimeout(()=>change(`${d.t} deleted`,()=>{DONE=DONE.filter(x=>x.id!==id)}),300)}
  }
});

/* simulated progress: replace with your real download manager */
setInterval(()=>{
  let finished=null;
  ACTIVE.forEach(a=>{
    if(a.st!=='dl')return;
    a.p=Math.min(1,a.p+a.spd*.5/a.mb);
    const card=document.querySelector(`.dc[data-id="${a.id}"]`);
    if(card){card.querySelector('.bar i').style.setProperty('--p',a.p);card.querySelector('[data-s]').textContent=status(a)}
    if(a.p>=1&&!finished)finished=a;
  });
  storage();
  if(finished){
    const a=finished;ACTIVE=ACTIVE.filter(x=>x!==a);
    const ep={l:a.l,sub:a.sub,mb:a.mb,exp:30};
    if(a.l){const s=DONE.find(x=>x.type==='series'&&x.t===a.t);
      if(s){s.eps.push(ep);open.add(s.id)}else DONE.unshift({id:nid++,type:'series',t:a.t,q:a.q,k:a.k,eps:[ep]})}
    else DONE.unshift({id:nid++,type:'movie',t:a.t,sub:a.sub,mb:a.mb,exp:30,q:a.q,k:a.k});
    fresh=true;render();toast(`Downloaded: ${a.t}`);undoFn=null;
  }
},500);

/* thumbnails: frames grabbed from the video URL (no embedded images) */
(function(){
  const v=document.createElement('video');v.crossOrigin='anonymous';v.muted=true;v.preload='auto';v.playsInline=true;
  const c=document.createElement('canvas'),x=c.getContext('2d');c.width=480;c.height=270;
  const seek=t=>new Promise(r=>{v.addEventListener('seeked',r,{once:true});v.currentTime=t});
  v.addEventListener('loadedmetadata',async()=>{
    for(let k=0;k<THUMB_AT.length;k++){
      try{await seek(THUMB_AT[k]);x.drawImage(v,0,0,480,270);const u=c.toDataURL('image/jpeg',.8);TH[k]=u;
        document.querySelectorAll(`.th[data-k="${k}"]`).forEach(el=>el.style.backgroundImage=`url(${u})`)}catch(e){break}
    }
  },{once:true});
  v.src=SRC;
})();

/* keyboard / remote: arrows move focus spatially */
addEventListener('keydown',e=>{
  const d={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key],a=document.activeElement;
  if(!d||!a||!a.matches('button'))return;
  const r=a.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let best=null,bs=1e9;
  document.querySelectorAll('button').forEach(x=>{
    if(x===a||!x.offsetParent||x.tabIndex<0)return;
    const b=x.getBoundingClientRect(),dx=b.left+b.width/2-cx,dy=b.top+b.height/2-cy,p=d[0]?dx*d[0]:dy*d[1],o=d[0]?Math.abs(dy):Math.abs(dx);
    if(p<=2)return;const s=p+o*2.2;if(s<bs){bs=s;best=x}});
  if(best){e.preventDefault();best.focus();best.scrollIntoView({block:'nearest',inline:'nearest',behavior:'smooth'})}
});

render();
</script>
