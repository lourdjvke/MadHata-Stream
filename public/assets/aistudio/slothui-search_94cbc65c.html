<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Search · slothui original</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
:root{--bg:#0b0e16;--rail-bg:#121a2b;--acc:#5b4ee8;--ease:cubic-bezier(.22,1,.36,1);--rail:4.4rem;--g:clamp(1.25rem,5.4vw,8rem);--pg:clamp(.6rem,1vw,1.4rem);--per:6;--pc:24svh;--cw:clamp(9rem,11vw,22rem);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
font-size:clamp(14px,.4vw + 10.2px,30px);scroll-behavior:smooth;scroll-padding-top:10rem;background:var(--bg)}
body{background:var(--bg);color:#fff;font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input{font:inherit;color:inherit;background:none;border:0;-webkit-tap-highlight-color:transparent}
button{cursor:pointer;text-align:inherit}
:focus-visible{outline:2px solid #9d94ff;outline-offset:3px}
.i{width:1.25rem;height:1.25rem;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
@keyframes up{from{opacity:0;transform:translateY(1.4rem)}}
.rv{animation:up 1s var(--ease) both;animation-delay:calc(var(--n,0)*90ms + 100ms)}

/* rail */
.rail{position:fixed;z-index:60;inset:0 auto 0 0;width:var(--rail);padding:1.1rem 0 1.2rem;background:var(--rail-bg);border-right:1px solid rgba(255,255,255,.06);display:flex;flex-direction:column;align-items:center;gap:.5rem}
.logo{width:1.6rem;height:1.6rem;border-radius:.5rem;background:linear-gradient(135deg,#7f63ff,#3b2fd0);display:grid;place-items:center;font-weight:800;font-size:.95rem;flex:none}
.rail .logo{width:2rem;height:2rem;border-radius:.65rem;margin-bottom:1.2rem;font-size:1.1rem}
.nb{width:2.7rem;height:2.7rem;border-radius:.85rem;display:grid;place-items:center;color:#8d95aa;transition:color .3s,background .3s,transform .4s var(--ease)}
.nb:hover{color:#fff;background:rgba(255,255,255,.07);transform:translateX(2px) scale(1.06)}
.nb:active{transform:scale(.92)}.nb.on{color:#fff;background:rgba(255,255,255,.1)}
.sp{margin-top:auto}
.av{width:2.2rem;height:2.2rem;border-radius:50%;margin-top:.6rem;border:2px solid #243049;background:radial-gradient(circle at 35% 30%,#ffd29b,#ee7a5a 60%,#8a3a5a)}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;padding:1.1rem 1.25rem 1.1rem calc(var(--rail) + 1.25rem)}
.ic{width:2.3rem;height:2.3rem;border-radius:50%;display:grid;place-items:center;background:rgba(20,27,45,.92);border:1px solid rgba(255,255,255,.12);transition:transform .4s var(--ease),background .3s}
.ic:hover{background:#1d2742;transform:scale(1.08)}.ic.bk:hover{transform:translateX(-3px) scale(1.08)}.ic:active{transform:scale(.92)}
.brand{display:flex;align-items:center;gap:.5rem;font-size:1.05rem;font-weight:300}.brand b{font-weight:800}

/* sticky search + filters */
.sb{position:sticky;top:0;z-index:40;padding:.9rem var(--g) .9rem calc(var(--rail) + var(--g));background:rgba(11,14,22,.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.field{display:flex;align-items:center;gap:.9rem;max-width:58rem;height:3.7rem;padding:0 .7rem 0 1.3rem;border-radius:99px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);transition:border-color .3s,background .3s,box-shadow .4s}
.field:focus-within{border-color:#8f86ff;background:rgba(255,255,255,.09);box-shadow:0 0 0 .3rem rgba(91,78,232,.25)}
.field .i{color:#9aa1b4;transition:color .3s}.field:focus-within>.i{color:#fff}
.field input{flex:1;min-width:0;height:100%;font-size:1.05rem;font-weight:500;outline:0;-webkit-appearance:none;appearance:none}
.field input::placeholder{color:#7f879b}
.field input::-webkit-search-cancel-button{display:none}
.clr{width:2.4rem;height:2.4rem;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.12);transform:scale(0);opacity:0;transition:transform .45s var(--ease),opacity .3s,background .3s}
.clr.show{transform:none;opacity:1}.clr:hover{background:rgba(255,255,255,.22)}.clr .i{width:1rem;height:1rem}
.flt{display:flex;flex-wrap:wrap;align-items:center;gap:.7rem 1rem;margin-top:.9rem}
.seg{display:flex;gap:.4rem}
.seg button,.chips button{padding:.5rem 1.05rem;border-radius:99px;font-size:.8rem;font-weight:600;white-space:nowrap;transition:background .3s,color .3s,border-color .3s,transform .4s var(--ease)}
.seg button{background:rgba(255,255,255,.08);color:#b4bacb}
.seg button:hover{background:rgba(255,255,255,.15);color:#fff;transform:translateY(-2px)}
.seg button.on{background:var(--acc);color:#fff}
.chips{display:flex;gap:.5rem;flex:1 1 18rem;min-width:0;overflow-x:auto;scrollbar-width:none;padding:.25rem .2rem;margin:-.25rem -.2rem}
.chips::-webkit-scrollbar{display:none}
.chips button{border:1px solid rgba(255,255,255,.28);color:#dfe3ee}
.chips button:hover{border-color:rgba(255,255,255,.6);color:#fff;transform:translateY(-2px)}
.chips button.on{border-color:#8f86ff;color:#fff;box-shadow:0 0 0 1px rgba(143,134,255,.3),0 .5rem 1.4rem -.7rem rgba(91,78,232,.7)}

/* sections */
.sec{padding:1.9rem 0 0 calc(var(--rail) + var(--g))}
.sec:last-child{padding-bottom:clamp(2.5rem,7svh,5rem)}
.lb{display:flex;justify-content:space-between;align-items:center;padding-right:var(--g);margin-bottom:1rem;font-size:1.1rem;font-weight:700}
.lb button{font-size:.78rem;font-weight:600;color:#9aa1b4;transition:color .3s}.lb button:hover{color:#fff}
.rcs{display:flex;flex-wrap:wrap;gap:.6rem;padding-right:var(--g)}
.rc{display:inline-flex;align-items:center;border:1px solid rgba(255,255,255,.28);border-radius:99px;transition:border-color .3s,transform .4s var(--ease)}
.rc:hover{border-color:rgba(255,255,255,.6);transform:translateY(-2px)}
.rc .rt{padding:.5rem .3rem .5rem 1rem;font-size:.85rem;font-weight:600}
.rc .rx{display:grid;place-items:center;width:2rem;height:2rem;margin-right:.2rem;border-radius:50%;color:#9aa1b4;transition:color .3s,background .3s}
.rc .rx:hover{color:#fff;background:rgba(255,255,255,.12)}.rc .rx .i{width:.85rem;height:.85rem;stroke-width:2}

.row{display:flex;gap:var(--pg);overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-left:.7rem;scrollbar-width:none;overscroll-behavior-x:contain;padding:.9rem var(--g) 1rem .7rem;margin:-.9rem 0 -1rem -.7rem;cursor:grab}
.row::-webkit-scrollbar{display:none}.row.drag{scroll-snap-type:none;scroll-behavior:auto;cursor:grabbing}
.p{flex:0 0 min(calc((100% - var(--pg)*(var(--per) - 1))/var(--per)),var(--pc));aspect-ratio:2/3;position:relative;overflow:hidden;container-type:inline-size;scroll-snap-align:start;border-radius:.85rem;border:1px solid rgba(255,255,255,.1);display:flex;align-items:flex-end;justify-content:center;text-align:center;padding:0 .5rem 1.1rem;transition:transform .5s var(--ease),border-color .3s,box-shadow .5s}
.p::after,.pz::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 45%,rgba(0,0,0,.7))}
.p span,.pz span{position:relative;z-index:1;font-weight:800;font-size:11cqw;line-height:1.08;letter-spacing:.05em;text-transform:uppercase;text-shadow:0 .1rem .6rem rgba(0,0,0,.6)}
.p[data-r]::before{content:attr(data-r);position:absolute;z-index:1;left:.7rem;top:.4rem;font-size:22cqw;font-weight:800;line-height:1;color:transparent;-webkit-text-stroke:1.5px rgba(255,255,255,.75)}
.p:hover,.p:focus-visible{transform:translateY(-.5rem) scale(1.04);border-color:rgba(255,255,255,.55);box-shadow:0 1.3rem 2.4rem -.8rem rgba(0,0,0,.85)}
.p:active{transform:translateY(-.2rem) scale(.99)}

.gts{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,13rem),1fr));gap:clamp(.8rem,1.2vw,1.4rem);padding-right:var(--g)}
.gt{position:relative;aspect-ratio:16/9;display:flex;align-items:flex-end;padding:.9rem 1rem;border-radius:1rem;overflow:hidden;font-weight:800;font-size:1.05rem;border:1px solid rgba(255,255,255,.1);transition:transform .5s var(--ease),border-color .3s,box-shadow .5s}
.gt::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 40%,rgba(0,0,0,.45))}.gt span{position:relative;z-index:1}
.gt:hover,.gt:focus-visible{transform:translateY(-.3rem) scale(1.03);border-color:rgba(255,255,255,.5);box-shadow:0 1.1rem 2rem -.8rem rgba(0,0,0,.85)}

/* results */
.rh{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;padding-right:var(--g);margin-bottom:1.2rem;font-size:.95rem;font-weight:600;color:#aab0c0}
.rh b{color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--cw),1fr));gap:1.7rem clamp(.8rem,1.4vw,1.8rem);padding-right:var(--g)}
.sc{display:block;text-align:left;outline-offset:6px;border-radius:.9rem}
.sc.n{animation:up .7s var(--ease) both;animation-delay:calc(var(--i)*40ms)}
.pz{position:relative;display:flex;align-items:flex-end;justify-content:center;aspect-ratio:2/3;border-radius:.85rem;overflow:hidden;container-type:inline-size;text-align:center;padding:0 .5rem 1.1rem;border:1px solid rgba(255,255,255,.1);transition:transform .5s var(--ease),border-color .3s,box-shadow .5s}
.sc:hover .pz,.sc:focus-visible .pz{transform:translateY(-.4rem) scale(1.03);border-color:rgba(255,255,255,.55);box-shadow:0 1.3rem 2.4rem -.8rem rgba(0,0,0,.85)}
.sc:active .pz{transform:scale(.98)}
.cp{display:flex;justify-content:space-between;gap:.5rem;margin-top:.75rem;font-size:.76rem;font-weight:600;color:#aab0c0}
.cp em{font-style:normal;font-weight:700;color:#ffc933}
mark{background:none;color:#fff;box-shadow:inset 0 -.32em 0 rgba(91,78,232,.8)}
.none{display:grid;justify-items:center;gap:.8rem;max-width:30rem;margin:3rem 0;padding-right:var(--g);text-align:center;color:#aab0c0;font-size:.9rem}
.none .big{width:4.2rem;height:4.2rem;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(255,255,255,.2);color:#9aa1b4}
.none .big .i{width:1.7rem;height:1.7rem}
.none h3{font-size:1.2rem;color:#fff}
.none .chips{flex:none;justify-content:center;flex-wrap:wrap;overflow:visible}

@media (max-width:1100px){:root{--per:4.3}}
@media (max-width:720px){
:root{--rail:0rem;--g:1.1rem;--per:2.5;--pc:100svh;scroll-padding-top:9rem}
.rail{inset:auto 0 0 0;width:auto;flex-direction:row;justify-content:space-around;gap:0;padding:.55rem .8rem calc(.55rem + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid rgba(255,255,255,.08)}
.rail .logo,.rail .gear,.rail .av{display:none}.sp{margin:0}
.top{padding-inline:1.1rem}
.field{height:3.3rem}
.sec:last-child{padding-bottom:6rem}
}
@media (prefers-reduced-motion:reduce){*,::before,::after{animation:none!important;transition-duration:.01ms!important}:root{scroll-behavior:auto}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>
<symbol id="search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></symbol>
<symbol id="chart" viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></symbol>
<symbol id="user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></symbol>
<symbol id="cal" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="16" rx="2.5"/><path d="M4 10h16M8 3v4M16 3v4"/></symbol>
<symbol id="bolt" viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></symbol>
<symbol id="bell" viewBox="0 0 24 24"><path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4zM10 21h4"/></symbol>
<symbol id="gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></symbol>
<symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="al" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></symbol>
<symbol id="x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
</defs></svg>

<nav class="rail" aria-label="Main">
  <div class="logo">S</div>
  <button class="nb" aria-label="Home"><svg class="i"><use href="#home"/></svg></button>
  <button class="nb on" aria-label="Search" aria-current="page"><svg class="i"><use href="#search"/></svg></button>
  <button class="nb" aria-label="Stats"><svg class="i"><use href="#chart"/></svg></button>
  <button class="nb" aria-label="Profile"><svg class="i"><use href="#user"/></svg></button>
  <button class="nb" aria-label="Calendar"><svg class="i"><use href="#cal"/></svg></button>
  <button class="nb" aria-label="Activity"><svg class="i"><use href="#bolt"/></svg></button>
  <button class="nb" aria-label="Notifications"><svg class="i"><use href="#bell"/></svg></button>
  <button class="nb gear sp" aria-label="Settings"><svg class="i"><use href="#gear"/></svg></button>
  <div class="av" role="img" aria-label="Account"></div>
</nav>

<header class="top rv" style="--n:0">
  <button class="ic bk" aria-label="Back"><svg class="i"><use href="#al"/></svg></button>
  <div class="brand"><span class="logo">S</span><span><b>slothui</b> original</span></div>
  <button class="ic" aria-label="Add"><svg class="i"><use href="#plus"/></svg></button>
</header>

<div class="sb rv" style="--n:1">
  <label class="field"><svg class="i"><use href="#search"/></svg><input id="q" type="search" placeholder="Search movies, shows, genres" autocomplete="off" enterkeyhint="search" aria-label="Search"><button class="clr" id="clr" aria-label="Clear search" tabindex="-1"><svg class="i"><use href="#x"/></svg></button></label>
  <div class="flt"><div class="seg" id="seg" role="group" aria-label="Type"></div><div class="chips" id="chips" role="group" aria-label="Genres"></div></div>
</div>

<main>
  <div id="idle">
    <section class="sec rv" id="rcsec" style="--n:2"><div class="lb"><span>Recent searches</span><button id="rclr">Clear all</button></div><div class="rcs" id="rcs"></div></section>
    <section class="sec rv" style="--n:3"><div class="lb"><span>Trending now</span></div><div class="row" id="trend"></div></section>
    <section class="sec rv" style="--n:4"><div class="lb"><span>Browse all</span></div><div class="gts" id="gts"></div></section>
  </div>
  <section class="sec" id="res" hidden>
    <div class="rh"><span id="cnt" aria-live="polite"></span></div>
    <div class="grid" id="grid"></div>
    <div class="none" id="none" hidden><div class="big"><svg class="i"><use href="#search"/></svg></div><h3 id="nt"></h3><p>Try a different title or browse by genre.</p><div class="chips" id="sug"></div></div>
  </section>
</main>

<script>
const $=s=>document.querySelector(s);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const grad=(h,s,l,i)=>{const a=(h+i*22)%360,c=(a+25)%360;return `linear-gradient(180deg,hsl(${a} ${s}% ${l}%),hsl(${c} ${Math.round(s*.85)}% 20%) 52%,hsl(${c} 40% 7%))`};

/* catalogue (placeholder titles) */
const X=['Sci-Fi','Drama','Comedy','Romance','Thriller','Animation','Mystery'];
const FEAT=[
['Houses & Dragons','Fantasy','linear-gradient(180deg,#c08c36,#6b4a1c 52%,#1b1510)'],
['The Last of Us','Drama','linear-gradient(180deg,#d8a35a,#5b6a4a 48%,#1d2418)'],
['The Mandalorian','Sci-Fi','linear-gradient(180deg,#e0923f,#8a4a1f 52%,#2a1a14)'],
['Loki','Fantasy','radial-gradient(circle at 50% 30%,#f2c75a,#3d6b45 55%,#102a1c)'],
['The Witcher','Fantasy','linear-gradient(180deg,#8696a0,#3d4a55 55%,#161c22)'],
['Wednesday','Mystery','linear-gradient(180deg,#4a56a0,#1f2350 55%,#0b0d1f)'],
['La Casa de Papel','Thriller','linear-gradient(180deg,#c3282a,#7a1210 55%,#2a0707)']];
const CATS=[
['Horror',350,45,32,['The Hollow','Night Ward','Black Chapel','Salt & Bone','The Lantern','Dead Hour','Mother Moon']],
['Fantasy',265,48,40,['Ember Crown','The Last Glade','Moonspire','Wyrm Song','Ashen Realm','Elder Tales','Starforge']],
['Action',18,70,40,['Redline','Breakpoint','Iron Harbor','Nine Seconds','Cold Strike','Last Convoy','Zero Hour']],
['BL',320,58,58,['Sunday Letters','Blue Hour','Paper Stars','Seaside Duet','After Class','Love in Bloom','Moon Cafe']],
['Superhero',215,62,44,['Nova Guard','Captain Volt','The Sentinel','Skyfall Squad','Midnight Hero','Aegis','Rise of Titan']]];
const ITEMS=[];let n=0;
const add=(t,g,bg)=>{ITEMS.push({t,g,bg,type:n%3?'Movie':'Series',y:2024+n%7,r:(4.1+(n*7%9)/10).toFixed(1)});n++};
FEAT.forEach(([t,g,bg],i)=>add(t,[g,X[(i*2+1)%7]].filter((a,j,A)=>A.indexOf(a)===j),bg));
CATS.forEach(([c,h,s,l,L])=>L.forEach((t,i)=>add(t,[c,X[(n*3)%7]],grad(h,s,l,i))));
const GEN=['Horror','Fantasy','Action','BL','Superhero',...X];
const GH={Horror:350,Fantasy:265,Action:18,BL:320,Superhero:215,'Sci-Fi':195,Drama:30,Comedy:48,Romance:340,Thriller:0,Animation:150,Mystery:250};

/* state */
let q='',type='All',genre='',prev=new Set(),tm;
let RC;try{RC=JSON.parse(localStorage.getItem('slothui-recent'))}catch(e){}
RC=Array.isArray(RC)?RC:['Houses & Dragons','Horror','Wednesday'];
const save=()=>{try{localStorage.setItem('slothui-recent',JSON.stringify(RC))}catch(e){}};
const push=t=>{t=t.trim();if(!t)return;RC=[t,...RC.filter(x=>x.toLowerCase()!==t.toLowerCase())].slice(0,8);save();recent()};
const inp=$('#q'),clr=$('#clr');

/* filters */
$('#seg').innerHTML=[['All','All'],['Movie','Movies'],['Series','Series']].map(([v,l])=>`<button data-v="${v}" class="${v===type?'on':''}">${l}</button>`).join('');
$('#chips').innerHTML=GEN.map(g=>`<button data-g="${g}">${g}</button>`).join('');
$('#seg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;type=b.dataset.v;sync();render(1)});
$('#chips').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;setGenre(genre===b.dataset.g?'':b.dataset.g)});
function setGenre(g){genre=g;sync();render(1);if(g)scrollTo({top:0})}
function sync(){
  document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.v===type));
  document.querySelectorAll('#chips button').forEach(b=>{const on=b.dataset.g===genre;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on)});
}

/* idle: recents, trending, genres */
function recent(){
  $('#rcsec').hidden=!RC.length;
  $('#rcs').innerHTML=RC.map((t,i)=>`<span class="rc"><button class="rt" data-i="${i}">${esc(t)}</button><button class="rx" data-i="${i}" aria-label="Remove ${esc(t)}"><svg class="i"><use href="#x"/></svg></button></span>`).join('');
}
$('#rcs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const i=+b.dataset.i;
  if(b.classList.contains('rx')){RC.splice(i,1);save();recent()}else setQ(RC[i])});
$('#rclr').onclick=()=>{RC=[];save();recent()};
$('#trend').innerHTML=[...ITEMS].sort((a,b)=>b.r-a.r).slice(0,8).map((it,i)=>`<button class="p" data-r="${i+1}" data-t="${esc(it.t)}" style="background:${it.bg}"><span>${esc(it.t)}</span></button>`).join('');
$('#trend').addEventListener('click',e=>{const b=e.target.closest('.p');if(b)setQ(b.dataset.t)});
$('#gts').innerHTML=GEN.map(g=>{const h=GH[g];return `<button class="gt" data-g="${g}" style="background:linear-gradient(135deg,hsl(${h} 62% 44%),hsl(${(h+30)%360} 55% 17%))"><span>${g}</span></button>`}).join('');
$('#gts').addEventListener('click',e=>{const b=e.target.closest('.gt');if(b)setGenre(b.dataset.g)});

/* search */
function score(it){
  if(!q)return 1;const t=it.t.toLowerCase(),s=q.toLowerCase();
  if(t.startsWith(s))return 4;if(t.includes(s))return 3;
  if(it.g.some(g=>g.toLowerCase().startsWith(s)))return 2;
  if(it.type.toLowerCase().startsWith(s)||String(it.y).includes(s))return 1;return 0;
}
function hl(t){
  const i=q?t.toLowerCase().indexOf(q.toLowerCase()):-1;
  return i<0?esc(t):esc(t.slice(0,i))+'<mark>'+esc(t.slice(i,i+q.length))+'</mark>'+esc(t.slice(i+q.length));
}
function render(fresh){
  const act=q||type!=='All'||genre;
  $('#idle').hidden=!!act;$('#res').hidden=!act;
  if(!act){prev=new Set();return}
  const L=ITEMS.map(it=>[it,score(it)]).filter(([it,s])=>s&&(type==='All'||it.type===type)&&(!genre||it.g.includes(genre))).sort((a,b)=>b[1]-a[1]||b[0].r-a[0].r);
  const bits=[q&&`“${esc(q)}”`,genre,type!=='All'&&type].filter(Boolean).join(' · ');
  $('#cnt').innerHTML=`<b>${L.length}</b> result${L.length===1?'':'s'}${bits?' for '+bits:''}`;
  $('#none').hidden=!!L.length;
  if(!L.length){$('#nt').textContent=q?`No results for “${q}”`:'Nothing matches these filters';$('#sug').innerHTML=['Fantasy','Horror','Action','Drama'].map(g=>`<button data-g="${g}">${g}</button>`).join('')}
  const next=new Set(L.map(([it])=>it.t));let k=0;
  $('#grid').innerHTML=L.map(([it])=>{const nw=fresh||!prev.has(it.t);return `<button class="sc${nw?' n':''}" style="--i:${nw?k++%14:0}" data-t="${esc(it.t)}"><span class="pz" style="background:${it.bg}"><span>${hl(it.t)}</span></span><span class="cp"><span>${it.y} · ${it.type}</span><em>★ ${it.r}</em></span></button>`}).join('');
  prev=next;
}
$('#sug').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;q='';inp.value='';clr.classList.remove('show');setGenre(b.dataset.g)});
$('#grid').addEventListener('click',e=>{const b=e.target.closest('.sc');if(b)push(b.dataset.t)});
function setQ(v){q=v.trim();inp.value=v;clr.classList.toggle('show',!!q);render(1);inp.focus({preventScroll:true});scrollTo({top:0})}
inp.addEventListener('input',()=>{q=inp.value.trim();clr.classList.toggle('show',!!inp.value);clearTimeout(tm);tm=setTimeout(()=>render(0),90)});
inp.addEventListener('keydown',e=>{if(e.key==='Enter'){push(inp.value);inp.blur()}});
function clear(){q='';inp.value='';clr.classList.remove('show');render(1);inp.focus({preventScroll:true})}
clr.onclick=clear;

/* poster row drag (mouse) */
let dr=null;
document.addEventListener('pointerdown',e=>{const r=e.target.closest('.row');if(!r||e.pointerType!=='mouse')return;dr={r,sx:e.clientX,sl:r.scrollLeft,mv:0}});
addEventListener('pointermove',e=>{if(!dr)return;const d=e.clientX-dr.sx;if(Math.abs(d)>5){dr.mv=1;dr.r.classList.add('drag')}if(dr.mv)dr.r.scrollLeft=dr.sl-d});
addEventListener('pointerup',()=>{if(!dr)return;dr.r.classList.remove('drag');dr.r.dataset.mv=dr.mv;dr=null});
document.addEventListener('click',e=>{const r=e.target.closest('.row');if(r&&r.dataset.mv==='1'){e.preventDefault();e.stopPropagation();r.dataset.mv=0}},true);

/* keyboard: "/" focuses search, Esc clears, arrow keys move focus spatially (remote / d-pad friendly) */
addEventListener('keydown',e=>{
  const a=document.activeElement;
  if(e.key==='/'&&a!==inp){e.preventDefault();inp.focus();return}
  if(e.key==='Escape'&&(q||a===inp)){clear();return}
  const d={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];
  if(!d||!a||!a.matches('button,input')||(a===inp&&d[0]))return;
  const r=a.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let best=null,bs=1e9;
  document.querySelectorAll('button,input').forEach(x=>{
    if(x===a||!x.offsetParent||x.tabIndex<0)return;
    const b=x.getBoundingClientRect(),dx=b.left+b.width/2-cx,dy=b.top+b.height/2-cy,p=d[0]?dx*d[0]:dy*d[1],o=d[0]?Math.abs(dy):Math.abs(dx);
    if(p<=2)return;const s=p+o*2.2;if(s<bs){bs=s;best=x}});
  if(best){e.preventDefault();best.focus({preventScroll:true});best.scrollIntoView({block:'nearest',inline:'nearest',behavior:'smooth'})}
});

recent();sync();render(1);
</script>
</body>
